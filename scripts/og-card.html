<!doctype html>
<!--
  og-card.html: The artwork for the social share card.

  What it does:  Lays out the 1200x630 picture people see when the site's link is shared
                 in a text, in Discord, on LinkedIn and so on.
  Depends on:    ../src/styles/brand.css (every color and font comes from its tokens, so the
                 card can never drift from the brand) and ../assets/icons/icon.svg.
  Used by:       scripts/make-og-image.js, which screenshots this file into
                 assets/social/og-image.png. It is NOT shipped to the website
                 (scripts/ is not in the allow-list in scripts/build-site.js).

  DEV NOTE: it is opened over file:// by the script, so the relative paths above resolve
  and the self-hosted fonts load without a server.
  DEV NOTE: change the words here and re-run `npm run og`, then commit the new PNG.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Digital Sorcery share card</title>
  <link rel="stylesheet" href="../src/styles/brand.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: var(--surface);
      color: var(--ink);
      display: grid;
      grid-template-columns: 1fr 420px;
      align-items: center;
      gap: 56px;
      padding: 0 72px;
      box-sizing: border-box;
      overflow: hidden;
    }
    /* A hairline frame, like the rules on the page. No glows, no gradients (brand kit). */
    .frame {
      position: absolute;
      inset: 24px;
      border: 1px solid var(--line);
      pointer-events: none;
    }
    .eyebrow {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-text);
      margin: 0 0 24px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 92px;
      line-height: 1.05;
      letter-spacing: 0.02em;
      margin: 0 0 28px;
      color: var(--ink);
    }
    .lede {
      font-family: var(--font-text);
      font-size: 38px;
      line-height: 1.3;
      margin: 0 0 36px;
      color: var(--ink-muted);
      max-width: 15em;
    }
    /* DEV NOTE: --gold-text, not --bronze: bronze is a non-text color in
       scripts/check-contrast.js (under 4.5:1 on the page background). */
    .address {
      font-family: var(--font-ui);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.06em;
      color: var(--gold-text);
      margin: 0;
    }
    .mark { width: 420px; height: 420px; display: block; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div>
    <p class="eyebrow">Butler Builds</p>
    <h1>Digital Sorcery</h1>
    <p class="lede">Gather the ingredients. Cast one clear prompt. Build the app right.</p>
    <p class="address">digitalsorcery.butlerbuilds.dev</p>
  </div>
  <img class="mark" src="../assets/icons/icon.svg" alt="">
</body>
</html>
