# ci-deploy.yml: Test every change; publish the site only when main passes.
#
# Pull requests and pushes to any branch → run the tests.
# Pushes to main → run the tests, THEN publish to Firebase Hosting if a key is set.
# DEV NOTE(v1.2): Firebase lives in the shared mp-soul-stats project, so it is published by hand
# on "deploy" and the Firebase job skips itself: no key is set (docs/DECISIONS.md D20).
# DEV NOTE(v1.2.1): the GitHub Pages job was deleted (docs/DECISIONS.md D23). Firebase serves the
# custom domain, and a second live copy without the firebase.json security headers helped nobody.
# Do not add a Pages job back: there is one home, digitalsorcery.butlerbuilds.dev.
#
# SECURITY: every action is pinned to an exact commit (the version is in the comment), so a
# moved tag can't change what runs. Dependabot opens PRs to update these pins.

name: Test & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# SECURITY: least privilege, and now for every job: with Pages gone, nothing asks for
# `pages: write` or `id-token: write` any more.
permissions:
  contents: read

jobs:
  test:
    name: Trial by Fire (automated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Color contrast (WCAG AA) and hidden-character checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Secret scan (simple)
        # DEV NOTE: a light guard on top of GitHub's own secret scanning. Docs are scanned
        # too (CLAUDE.md bans secrets everywhere); only this workflow file is skipped,
        # because it contains the patterns themselves.
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|service_role)' -- ':!.github/workflows/*'; then
            echo "Possible secret found. Remove it before merging." && exit 1
          fi
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # DEV NOTE: never cancel a deploy halfway; a second push waits for the first to finish.
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect only the files the website needs
        run: npm run build:site
      - name: Publish to Firebase Hosting
        # DEV NOTE: while the ids or the secret are missing this step says so and
        # passes, so main stays green until the Firebase project exists (docs/handoff/DEPLOY.md).
        # SECURITY: the key is written outside the repo, used once, then deleted. It is never
        # printed, and the service account can only publish Hosting. The deploy always names
        # the exact site and project, never a bare deploy.
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY_FILE: ${{ runner.temp }}/firebase-key.json
        run: |
          FIREBASE_PROJECT_ID=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          FIREBASE_SITE_ID=$(node -p "JSON.parse(require('fs').readFileSync('firebase.json','utf8')).hosting.site")
          case "$FIREBASE_PROJECT_ID$FIREBASE_SITE_ID" in
            *CHANGE-ME*)
              echo "Firebase project not created yet (.firebaserc / firebase.json still say CHANGE-ME). Skipping."
              exit 0
              ;;
          esac
          if [ -z "$FIREBASE_KEY" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret set yet. Skipping."
            exit 0
          fi
          printf %s "$FIREBASE_KEY" > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE" npx --yes firebase-tools@15.34.0 deploy --only "hosting:$FIREBASE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
