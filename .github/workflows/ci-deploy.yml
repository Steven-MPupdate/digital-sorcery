# ci-deploy.yml: Run the tests on every push. It publishes nothing.
#
# GitHub is only the backup of this code (Steven, 2026-10-25), so nothing is published from here:
# the site goes live only by hand, on Steven's "deploy" (`npm run deploy:firebase`, docs/handoff/DEPLOY.md).
# These tests just flag a broken backup early (docs/DECISIONS.md D26).
# DEV NOTE: the GitHub Pages job (D23) and the dormant Firebase job (D26) were deleted.
# Do not add a publish job back. (The file keeps its name so its run history stays together.)
#
# SECURITY: every action is pinned to an exact commit (the version is in the comment), so a
# moved tag can't change what runs. Dependabot opens PRs to update these pins.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# SECURITY: least privilege, and now for every job: with Pages gone, nothing asks for
# `pages: write` or `id-token: write` any more.
permissions:
  contents: read

jobs:
  test:
    name: Trial by Fire (automated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Color contrast (WCAG AA) and hidden-character checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Secret scan (simple)
        # DEV NOTE: a light guard on top of GitHub's own secret scanning. Docs are scanned
        # too (CLAUDE.md bans secrets everywhere); only this workflow file is skipped,
        # because it contains the patterns themselves.
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|service_role)' -- ':!.github/workflows/*'; then
            echo "Possible secret found. Remove it before merging." && exit 1
          fi
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
