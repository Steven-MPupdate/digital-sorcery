# ci-deploy.yml — Test every change; publish the site only when main passes.
#
# Pull requests and pushes to any branch → run the tests.
# Pushes to main → run the tests, THEN publish to GitHub Pages AND Firebase Hosting.
# DEV NOTE(v1.2): both hosts publish the same tested commit while Firebase is proven out.
# GitHub Pages goes away once Firebase serves the custom domain (see docs/DECISIONS.md).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions" (see docs/handoff/DEPLOY.md).
#
# SECURITY: every action is pinned to an exact commit (the version is in the comment), so a
# moved tag can't change what runs. Dependabot opens PRs to update these pins.

name: Test & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# SECURITY: least privilege by default; the deploy job asks for more below.
permissions:
  contents: read

jobs:
  test:
    name: Trial by Fire (automated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Color contrast (WCAG AA) and hidden-character checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Secret scan (simple)
        # DEV NOTE: a light guard on top of GitHub's own secret scanning. Docs are scanned
        # too (CLAUDE.md bans secrets everywhere); only this workflow file is skipped,
        # because it contains the patterns themselves.
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|service_role)' -- ':!.github/workflows/*'; then
            echo "Possible secret found. Remove it before merging." && exit 1
          fi
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # DEV NOTE: never cancel a deploy halfway; a second push waits for the first to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect only the files the website needs
        # DEV NOTE: both hosts publish this same folder, so the two sites cannot drift.
        # The script adds .nojekyll (GitHub Pages serves files as-is, no Jekyll).
        run: npm run build:site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # DEV NOTE: never cancel a deploy halfway; a second push waits for the first to finish.
    concurrency:
      group: firebase-hosting
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect only the files the website needs
        run: npm run build:site
      - name: Publish to Firebase Hosting
        # DEV NOTE: while the ids or the secret are missing this step says so and
        # passes, so main stays green until the Firebase project exists (docs/handoff/DEPLOY.md).
        # SECURITY: the key is written outside the repo, used once, then deleted. It is never
        # printed, and the service account can only publish Hosting. The deploy always names
        # the exact site and project, never a bare deploy.
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY_FILE: ${{ runner.temp }}/firebase-key.json
        run: |
          FIREBASE_PROJECT_ID=$(node -p "JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default")
          FIREBASE_SITE_ID=$(node -p "JSON.parse(require('fs').readFileSync('firebase.json','utf8')).hosting.site")
          case "$FIREBASE_PROJECT_ID$FIREBASE_SITE_ID" in
            *CHANGE-ME*)
              echo "Firebase project not created yet (.firebaserc / firebase.json still say CHANGE-ME). Skipping."
              exit 0
              ;;
          esac
          if [ -z "$FIREBASE_KEY" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret set yet. Skipping."
            exit 0
          fi
          printf %s "$FIREBASE_KEY" > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE" npx --yes firebase-tools@15.34.0 deploy --only "hosting:$FIREBASE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
